apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://docs.renovatebot.com/helm-charts'
    chart: renovate
    targetRevision: '46.330.0'
    helm:
      values: |
        # RENOVATE_TOKEN (a GitHub PAT or App token) is read from this secret.
        # Create it with: kubectl -n renovate create secret generic renovate-secrets --from-literal=RENOVATE_TOKEN=ghp_xxx
        existingSecret: renovate-secrets
        envList:
          - name: RENOVATE_PR_CONCURRENT_LIMIT
            value: '0'
        cronjob:
          schedule: '20,45 1,14,12 * * *'
          timeZone: 'Europe/Vienna'
        renovate:
          config: |
            {
              "platform": "github",
              "autodiscover": false,
              "repositories": ["FloGerber/argocd-templates"],
              "printConfig": true
            }
          persistence:
            cache:
              enabled: false
        redis:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: renovate
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true